[package]
name = "dot"
version = "0.1.1"
edition = "2024"
license = "MIT"
default-run = "dot"

[[bin]]
name = "dot"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["native", "dep:clap"]
native = [
    "dep:comfy-table",
    "dep:directories",
    "dep:tempfile",
    "dep:ureq",
    "dep:url",
]
dev-platform-override = ["cli"]

[dependencies]
clap = { version = "4.6", features = ["derive"], optional = true }
directories = { version = "6.0", optional = true }
indexmap = { version = "2.14", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
toml = { version = "1.1", features = ["preserve_order"] }
comfy-table = { version = "7.2", optional = true }
tempfile = { version = "3.27", optional = true }
ureq = { version = "3.3", default-features = false, features = ["rustls"], optional = true }
url = { version = "2.5", optional = true }
